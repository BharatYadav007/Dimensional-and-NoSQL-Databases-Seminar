name: nosql-seminar

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  python-demo:
    profiles: [demo]
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/setup.ps1 first}
      CASSANDRA_HOST: cassandra
      MONGODB_HOST: mongodb
      MONGODB_USERNAME: ${MONGODB_USERNAME:-seminar_admin}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:?Run scripts/setup.ps1 first}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Run scripts/setup.ps1 first}
    depends_on:
      redis: {condition: service_healthy}
      cassandra: {condition: service_healthy}
      mongodb: {condition: service_healthy}
      neo4j: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]

  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/setup.ps1 first}
    command:
      - sh
      - -ec
      - exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./commands:/seminar:ro
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 384m
    cpus: 1.0
    logging: *logging

  cassandra:
    image: cassandra:5.0.9
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CASSANDRA_PORT:-9042}:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: NoSQLSeminar
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_NUM_TOKENS: "16"
      MAX_HEAP_SIZE: 1024M
      HEAP_NEWSIZE: 256M
    volumes:
      - cassandra_data:/var/lib/cassandra
      - ./commands:/seminar:ro
    healthcheck:
      test: [CMD-SHELL, "cqlsh 127.0.0.1 9042 --connect-timeout=10 --request-timeout=10 -e 'SELECT release_version FROM system.local;' > /dev/null 2>&1"]
      interval: 30s
      timeout: 25s
      retries: 20
      start_period: 180s
    mem_limit: 3g
    cpus: 2.0
    stop_grace_period: 90s
    logging: *logging

  mongodb:
    image: mongo:8.0.34
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME:-seminar_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:?Run scripts/setup.ps1 first}
      MONGO_INITDB_DATABASE: university
    command: [mongod, --bind_ip_all, --wiredTigerCacheSizeGB, "0.25"]
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./docker/mongodb/01-schema.js:/docker-entrypoint-initdb.d/01-schema.js:ro
      - ./commands:/seminar:ro
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --host
        - 127.0.0.1
        - --eval
        - 'const a=db.getSiblingDB("admin"); if (!a.auth(process.env.MONGO_INITDB_ROOT_USERNAME,process.env.MONGO_INITDB_ROOT_PASSWORD).ok) quit(1); if(a.runCommand({ping:1}).ok !== 1) quit(2);'
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    mem_limit: 1g
    cpus: 1.0
    logging: *logging

  neo4j:
    image: neo4j:5.26.32-community
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Run scripts/setup.ps1 first}
      SEMINAR_NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Run scripts/setup.ps1 first}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_server_default__listen__address: 0.0.0.0
      NEO4J_server_bolt_advertised__address: localhost:${NEO4J_BOLT_PORT:-7687}
      NEO4J_server_http_advertised__address: localhost:${NEO4J_HTTP_PORT:-7474}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./commands:/seminar:ro
    healthcheck:
      test: [CMD-SHELL, 'cypher-shell -a bolt://127.0.0.1:7687 -u neo4j -p "$$SEMINAR_NEO4J_PASSWORD" "RETURN 1;" > /dev/null 2>&1']
      interval: 20s
      timeout: 15s
      retries: 20
      start_period: 60s
    mem_limit: 1536m
    cpus: 2.0
    stop_grace_period: 60s
    logging: *logging

volumes:
  redis_data:
  cassandra_data:
  mongodb_data:
  mongodb_config:
  neo4j_data:
  neo4j_logs:
